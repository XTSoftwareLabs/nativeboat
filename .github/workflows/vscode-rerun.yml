name: VS Code rerun

# Runs the VS Code application an earlier VS Code workflow run built
# (its `vscode-app` artifact) again, with environment variables such as
# NATIVEBOAT_TRACE_IPC=1 or NATIVEBOAT_PROFILE_CALLS=1, and uploads the
# snapshot, output and logs as `vscode-result`.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: VS Code workflow run that built the application
        required: true
      environment:
        description: NAME=VALUE settings separated by semicolons
        default: ''
      wait_seconds:
        description: Seconds to run before the snapshot
        default: '120'
      sample_seconds:
        description: Seconds to sample the main process's stacks for (0 for none), into stacks.txt
        default: '0'
      sample_delay:
        description: Seconds after the start before sampling
        default: '20'
      settings:
        description: JSON object of more VS Code settings
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ROOT: D:\nb
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: vscode-app
          path: ${{ env.ROOT }}\out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run VS Code
        shell: pwsh
        env:
          SETTINGS: ${{ inputs.environment }}
          WAIT: ${{ inputs.wait_seconds }}
          SAMPLE: ${{ inputs.sample_seconds }}
          DELAY: ${{ inputs.sample_delay }}
          VSCODE_SETTINGS: ${{ inputs.settings }}
        run: |
          # Stack samples of the main process, while VS Code runs.
          $sampler = $null
          if ([int]$env:SAMPLE -gt 0) {
            New-Item -ItemType Directory -Force "$env:ROOT\result" | Out-Null
            $sampler = Start-Job -ArgumentList $env:ROOT, $env:GITHUB_WORKSPACE, ([int]$env:DELAY), ([int]$env:SAMPLE) -ScriptBlock {
              param($root, $repository, $delay, $seconds)
              Start-Sleep $delay
              $main = Get-CimInstance Win32_Process |
                Where-Object { $_.CommandLine -like '*--user-data-dir*' -and $_.ExecutablePath -like "$root\out\*" } |
                Select-Object -First 1
              python "$repository\scripts\sample-stacks.py" --pid $main.ProcessId --map "$root\out\native.map" `
                --out "$root\result\stacks.txt" --seconds $seconds 2>&1
            }
          }
          ./scripts/compat/vscode-run.ps1 -Out "$env:ROOT\out" -OutputDirectory "$env:ROOT\result" -Folder $env:GITHUB_WORKSPACE `
            -WaitSeconds $env:WAIT -Environment ($env:SETTINGS -split ';') -Settings $env:VSCODE_SETTINGS
          if ($sampler) { Receive-Job $sampler -Wait | Select-Object -Last 30 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-result
          path: ${{ env.ROOT }}\result
